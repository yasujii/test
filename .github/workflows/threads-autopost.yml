name: 桜腸活 Threads 自動投稿

# 各投稿時刻ピッタリに明示cronを置く方式（*/15 はGitHubに間引かれ2〜4時間ごとにしか回らなかったため）。
# cronはUTC。JSTの各投稿時刻の2分後に置いている（GitHubの定期実行は遅れる仕様なので、その頃には対象が「公開すべき」状態になる）。
# 実際の公開はGitHubの遅延で予約時刻から数十分ずれることがある。二重投稿は posted_log.json で防ぐ。
on:
  schedule:
    - cron: "2 21 * * *"    # 06:02 JST
    - cron: "12 22 * * *"   # 07:12 JST
    - cron: "2 23 * * *"    # 08:02 JST
    - cron: "12 0 * * *"    # 09:12 JST
    - cron: "2 1 * * *"     # 10:02 JST
    - cron: "2 3 * * *"     # 12:02 JST
    - cron: "12 3 * * *"    # 12:12 JST
    - cron: "2 4 * * *"     # 13:02 JST
    - cron: "2 6 * * *"     # 15:02 JST
    - cron: "12 6 * * *"    # 15:12 JST
    - cron: "2 12 * * *"    # 21:02 JST
    - cron: "2 13 * * *"    # 22:02 JST
  workflow_dispatch:        # 手動実行ボタン（テスト用）
    inputs:
      verify:
        description: "トークン確認のみ（投稿せず、接続とアカウントだけ確認）"
        type: boolean
        default: false
  push:
    branches: ["claude/video-editing-image-05T5N"]   # デフォルトブランチへのpushで発火。その時刻に公開すべき投稿を出す（Runボタンを押せない時のトリガー代わり）
    paths: ["threads-autopost/threads_posts.json", "threads-autopost/.trigger", ".github/workflows/threads-autopost.yml"]

# posted_log.json を書き戻すために書き込み権限が必要
permissions:
  contents: write

# 同時に複数動いて二重投稿しないように直列化
concurrency:
  group: threads-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 投稿を実行
        env:
          # トークンは「Secrets」から渡す（コードには絶対書かない）
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}   # 任意（未設定でも自動取得）
          VERIFY_ONLY: ${{ inputs.verify }}                 # 手動実行で確認モードにする用（定期実行では空=通常投稿）
        run: python threads-autopost/post_to_threads.py

      - name: 投稿済みログを保存（変更があれば）
        if: always()
        run: |
          if ! git diff --quiet -- threads-autopost/posted_log.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add threads-autopost/posted_log.json
            git commit -m "chore: update posted_log [skip ci]"
            git push
          else
            echo "posted_log.json に変更なし"
          fi
