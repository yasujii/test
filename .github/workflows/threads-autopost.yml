name: 桜腸活 Threads 自動投稿

# 自動投稿は【停止中】。ユーザーが手動投稿へ切り替えたため、2026-08-18に
# 定期実行(schedule)とpushトリガーを外し、手動実行(workflow_dispatch)だけ残した。
# 再開したいときは、以前の schedule と push ブロックを戻せばよい。
on:
  workflow_dispatch:        # 手動実行ボタンのみ（自動投稿は停止中）
    inputs:
      verify:
        description: "トークン確認のみ（投稿せず、接続とアカウントだけ確認）"
        type: boolean
        default: false

# posted_log.json を書き戻すために書き込み権限が必要
permissions:
  contents: write

# 同時に複数動いて二重投稿しないように直列化
concurrency:
  group: threads-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 投稿を実行
        env:
          # トークンは「Secrets」から渡す（コードには絶対書かない）
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}   # 任意（未設定でも自動取得）
          VERIFY_ONLY: ${{ inputs.verify }}                 # 手動実行で確認モードにする用（定期実行では空=通常投稿）
        run: python threads-autopost/post_to_threads.py

      - name: 投稿済みログを保存（変更があれば）
        if: always()
        run: |
          if ! git diff --quiet -- threads-autopost/posted_log.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add threads-autopost/posted_log.json
            git commit -m "chore: update posted_log [skip ci]"
            git push
          else
            echo "posted_log.json に変更なし"
          fi
