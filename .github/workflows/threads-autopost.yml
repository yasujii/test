name: 桜腸活 Threads 自動投稿

# 15分ごとに実行し、threads_posts.json の「予約時刻を過ぎたが未投稿」の投稿を公開します。
# これで 7:10 や 9:10 のような任意の時刻にも対応できます（各投稿は予約時刻から約15分以内に出ます）。
# GitHub Actions の定期実行は混雑時に数分ずれる仕様です。二重投稿は posted_log.json で防ぎます。
on:
  schedule:
    - cron: "3-59/15 * * * *"   # 毎時 :03 :18 :33 :48（UTC。ずれても catch-up で拾う）
  workflow_dispatch:        # 手動実行ボタン（テスト用）
    inputs:
      verify:
        description: "トークン確認のみ（投稿せず、接続とアカウントだけ確認）"
        type: boolean
        default: false
  push:
    branches: ["claude/video-editing-image-05T5N"]   # デフォルトブランチへのpushで発火。その時刻に公開すべき投稿を出す（Runボタンを押せない時のトリガー代わり）
    paths: ["threads-autopost/threads_posts.json", ".github/workflows/threads-autopost.yml"]

# posted_log.json を書き戻すために書き込み権限が必要
permissions:
  contents: write

# 同時に複数動いて二重投稿しないように直列化
concurrency:
  group: threads-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 投稿を実行
        env:
          # トークンは「Secrets」から渡す（コードには絶対書かない）
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}   # 任意（未設定でも自動取得）
          VERIFY_ONLY: ${{ inputs.verify }}                 # 手動実行で確認モードにする用（定期実行では空=通常投稿）
        run: python threads-autopost/post_to_threads.py

      - name: 投稿済みログを保存（変更があれば）
        if: always()
        run: |
          if ! git diff --quiet -- threads-autopost/posted_log.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add threads-autopost/posted_log.json
            git commit -m "chore: update posted_log [skip ci]"
            git push
          else
            echo "posted_log.json に変更なし"
          fi
