name: 桜腸活 Threads 調査（読み取り専用）

# 目的: GitHub Secret のトークンで Threads API を実際に叩き、他人のバズ投稿が
# APIで取得できるかを empirically に確認する。投稿は一切しない（GETのみ）。
on:
  workflow_dispatch:        # 手動実行ボタン
  push:
    branches: ["claude/video-editing-image-05T5N"]
    paths:
      - "threads-autopost/research_threads.py"
      - ".github/workflows/threads-research.yml"

# 読み取りのみ。書き戻し不要。
permissions:
  contents: read

concurrency:
  group: threads-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Threads API 調査を実行
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python threads-autopost/research_threads.py
