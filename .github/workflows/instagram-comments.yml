name: Instagram comments (anonymous, encrypted)
on:
  push:
    branches: ["codex/instagram-cloud-probe-20260924"]
    paths: ["cloud/instagram-comments/request.json"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: instagram-comments
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read this exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install fixed dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet -r cloud/instagram-comments/requirements.txt
      - name: Test parser and encrypted exports
        run: python3 -m unittest discover -s cloud/instagram-comments/tests -v
      - name: Read public comments; only encrypted text leaves runner
        run: |
          python3 cloud/instagram-comments/collector.py runner --request cloud/instagram-comments/request.json > encrypted-export.log
          python3 - <<'PY'
          from pathlib import Path
          text=Path('encrypted-export.log').read_text()
          print(text.split('IG_EXPORT_START')[0])
          PY
      - name: Return encrypted export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-encrypted-${{ github.run_id }}
          path: encrypted-export.log
          retention-days: 1
          if-no-files-found: error
