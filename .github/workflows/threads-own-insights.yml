name: 桜腸活 自分の投稿の表示回数（読み取り専用）

# 目的: 公式 Threads API で自分の投稿の views / likes 等を読むだけ。
# 投稿・削除・予約は一切しない（GETのみ）。伸びた1枚目の言い回しを分析する材料にする。
on:
  workflow_dispatch:        # 手動実行ボタン
  push:
    branches: ["claude/threads-growth-strategy-wilbpe"]
    paths:
      - "threads-autopost/own_insights.py"
      - ".github/workflows/threads-own-insights.yml"

# 読み取りのみ。書き戻し不要。
permissions:
  contents: read

concurrency:
  group: threads-own-insights
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 自分の投稿の表示回数を取得
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python threads-autopost/own_insights.py
