name: Instagram gut-health post-link discovery
on:
  push:
    branches: ["codex/instagram-cloud-probe-20260924"]
    paths: [".github/workflows/instagram-gut-discovery.yml"]
permissions: {}
jobs:
  discover:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read outbound post links from already identified articles only
        run: |
          python3 - <<'PY'
          import urllib.request, re, html, json, time
          sources=['https://note.com/myscrapbook/n/n2b51a8759f5a','https://39mag.thankyu.co.jp/article/beauty/diet/67468/','https://woman.tvbs.com.tw/beauty/63757','https://ameblo.jp/kikitti33/entry-12905862960.html']
          result=[]
          for u in sources:
              row={'discovery_source':u}
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=15) as r: s=r.read(5000000).decode('utf-8','replace')
                  s=html.unescape(s).replace('\\/','/')
                  row['instagram_post_urls']=list(dict.fromkeys(re.findall(r'https?://(?:www\.)?instagram\.com/(?:p|reel|tv)/[A-Za-z0-9_-]+/?',s)))
              except Exception as e:row['error']=type(e).__name__
              result.append(row);time.sleep(2)
          print(json.dumps({'scope':'links only, not testimonial content','sources':result},ensure_ascii=False,indent=2))
          PY
